<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shared Tasks</title>
    <meta name="description" content="A todo list for two people" />
    <meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tasks" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      html { background: #f6f8fc; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #111318; } }
      html[data-theme='dark'] { background: #111318; }
      html, body { margin: 0; height: 100%; }
      /* A layout can then use a height in percent. The app root itself has no box. */
      #app { height: 100%; }
    </style>
    <script>
      // Set the theme before the first paint, so a forced theme does not flash.
      try {
        var p = JSON.parse(localStorage.getItem('st.prefs') || '{}');
        if (p.theme === 'light' || p.theme === 'dark') {
          document.documentElement.dataset.theme = p.theme;
          // The bar of the browser gets the color of the forced theme, not of the system.
          var c = p.theme === 'dark' ? '#111318' : '#f6f8fc';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = c; });
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
